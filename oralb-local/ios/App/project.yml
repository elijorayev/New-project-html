# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: LocalBrush
options:
  bundleIdPrefix: local.oralb
  deploymentTarget:
    iOS: "17.0"
packages:
  OralBKit:
    path: ..
targets:
  LocalBrush:
    type: application
    platform: iOS
    sources: [LocalBrush]
    dependencies:
      - package: OralBKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LocalBrush talks directly to your toothbrush over Bluetooth. Nothing leaves your iPhone."
        # Set your own team in Xcode › Signing & Capabilities (a free Apple ID works).
        CODE_SIGN_STYLE: Automatic
